<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('cull-theme') === 'dark' ? 'dark' : 'light';
  const savedStyle = localStorage.getItem('cull-style');
  document.documentElement.dataset.style = ['standard','liquid'].includes(savedStyle) ? savedStyle : 'liquid';
  document.documentElement.dataset.density = localStorage.getItem('cull-density') || 'comfortable';
  const motionMode = localStorage.getItem('cull-motion') || 'system';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.dataset.motion = (motionMode === 'on' || (motionMode === 'system' && !reduced)) ? 'on' : 'off';
  document.documentElement.dataset.motionPref = motionMode;
} catch (_) {}
document.documentElement.classList.add('js');
</script>
